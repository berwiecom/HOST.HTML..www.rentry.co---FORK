[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rentry-client"
version = "1.0.0"
description = "Python client for the rentry.co markdown paste service API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["rentry", "markdown", "paste", "pastebin", "api"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://rentry.co"

[tool.setuptools.packages.find]
where = ["src"]
